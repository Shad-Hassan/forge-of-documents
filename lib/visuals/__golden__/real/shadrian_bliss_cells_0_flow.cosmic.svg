<svg id="flow-cosmic-shadrian_bliss_cells_0_flow" class="wf-svg" viewBox="0 0 902 717" width="902" height="717" role="img" aria-label="The run, start to finish" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-cosmic-shadrian_bliss_cells_0_flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0B6BF"/></marker></defs><text x="866" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Shad</text><text x="866" y="303" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Claude</text><text x="866" y="546" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Out</text><g class="wf-node"><rect x="36" y="66" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="82" width="4" height="97" rx="2" fill="#5683DA"/><text x="64" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Types /shadrian-bliss</text><text x="64" y="161" font-size="12.5" fill="#B0B6BF">or asks for a leadership status</text><text x="64" y="178" font-size="12.5" fill="#B0B6BF">email</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="340" y="82" width="4" height="97" rx="2" fill="#6E86B0"/><text x="354" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Gives the facts</text><text x="354" y="161" font-size="12.5" fill="#B0B6BF">his message, or the record</text></g><g class="wf-node"><rect x="36" y="309" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="325" width="4" height="97" rx="2" fill="#6E86B0"/><text x="64" y="339" font-size="12" font-weight="600" fill="#B0B6BF">Manual</text><text x="64" y="361" font-size="14" font-weight="600" fill="#F5F5F5">Drafts the email</text><text x="64" y="404" font-size="12.5" fill="#B0B6BF">Hello team, then Done, Waiting</text><text x="64" y="421" font-size="12.5" fill="#B0B6BF">on, Next</text></g><g class="wf-node"><rect x="326" y="309" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="340" y="325" width="4" height="97" rx="2" fill="#8FB0F0"/><text x="354" y="339" font-size="12" font-weight="600" fill="#B0B6BF">Decision</text><text x="354" y="361" font-size="14" font-weight="600" fill="#F5F5F5">Waiting on in play?</text><text x="354" y="404" font-size="12.5" fill="#B0B6BF">asks Shad one item at a time</text></g><g class="wf-node"><rect x="616" y="309" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="630" y="325" width="4" height="97" rx="2" fill="#6E86B0"/><text x="644" y="339" font-size="12" font-weight="600" fill="#B0B6BF">Manual</text><text x="644" y="361" font-size="14" font-weight="600" fill="#F5F5F5">Checks every line</text><text x="644" y="404" font-size="12.5" fill="#B0B6BF">source, no apology, no private</text><text x="644" y="421" font-size="12.5" fill="#B0B6BF">context</text></g><g class="wf-node"><rect x="36" y="552" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="568" width="4" height="97" rx="2" fill="#4FBF8A"/><text x="64" y="582" font-size="12" font-weight="600" fill="#B0B6BF">Target</text><text x="64" y="604" font-size="14" font-weight="600" fill="#F5F5F5">Pastes the email in chat</text><text x="64" y="647" font-size="12.5" fill="#B0B6BF">and writes the file</text></g><path d="M286,130 L324,130" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_0_flow-arrow)"/><path d="M451,197 V252 H161 V307" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_0_flow-arrow)"/><path d="M286,373 L324,373" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_0_flow-arrow)"/><path d="M576,373 L614,373" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_0_flow-arrow)"/><path d="M741,440 V495 H161 V550" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_0_flow-arrow)"/></svg>