<svg id="flow-print-protocols_s2_flows_0" class="wf-svg" viewBox="0 0 1482 768" width="1482" height="768" role="img" aria-label="Invocation, modes and decision" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-print-protocols_s2_flows_0-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525E"/></marker></defs><text x="1446" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Plexio</text><text x="1446" y="320" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Warden</text><text x="1446" y="580" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Next</text><g class="wf-node"><rect x="36" y="66" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="82" width="4" height="114" rx="2" fill="#2C6488"/><text x="64" y="96" font-size="12" font-weight="600" fill="#46525E">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#141A21">/plexio, or any artifact</text><text x="64" y="139" font-size="14" font-weight="600" fill="#141A21">for Shad with no style</text><text x="64" y="160" font-size="14" font-weight="600" fill="#141A21">named</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="82" width="4" height="114" rx="2" fill="#8DB8D3"/><text x="354" y="96" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="354" y="118" font-size="14" font-weight="600" fill="#141A21">Another house style named?</text><text x="354" y="161" font-size="12.5" fill="#46525E">If yes, that skill runs</text><text x="354" y="178" font-size="12.5" fill="#46525E">instead.</text></g><g class="wf-node"><rect x="616" y="66" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="630" y="82" width="4" height="114" rx="2" fill="#8DB8D3"/><text x="644" y="96" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="644" y="118" font-size="14" font-weight="600" fill="#141A21">Mode fits the content?</text><text x="644" y="161" font-size="12.5" fill="#46525E">Hard, note, survey-report,</text><text x="644" y="178" font-size="12.5" fill="#46525E">thread-record, hard-flowmode.</text></g><g class="wf-node"><rect x="906" y="66" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="920" y="82" width="4" height="114" rx="2" fill="#5E7A96"/><text x="934" y="96" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="934" y="118" font-size="14" font-weight="600" fill="#141A21">Base patterns</text><text x="934" y="161" font-size="12.5" fill="#46525E">No mode fits: use the base</text><text x="934" y="178" font-size="12.5" fill="#46525E">plexio patterns.</text></g><g class="wf-node"><rect x="1196" y="66" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="1210" y="82" width="4" height="114" rx="2" fill="#2F6B4F"/><text x="1224" y="96" font-size="12" font-weight="600" fill="#46525E">Target</text><text x="1224" y="118" font-size="14" font-weight="600" fill="#141A21">Mode chosen</text><text x="1224" y="161" font-size="12.5" fill="#46525E">Hard mode is the Synergy</text><text x="1224" y="178" font-size="12.5" fill="#46525E">Universe skin, never warden.</text></g><g class="wf-node"><rect x="36" y="326" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="342" width="4" height="114" rx="2" fill="#2C6488"/><text x="64" y="356" font-size="12" font-weight="600" fill="#46525E">Start</text><text x="64" y="378" font-size="14" font-weight="600" fill="#141A21">/warden, or a style word</text></g><g class="wf-node"><rect x="326" y="326" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="342" width="4" height="114" rx="2" fill="#8DB8D3"/><text x="354" y="356" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="354" y="378" font-size="14" font-weight="600" fill="#141A21">Outputs already named?</text></g><g class="wf-node"><rect x="616" y="326" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="630" y="342" width="4" height="114" rx="2" fill="#5E7A96"/><text x="644" y="356" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="644" y="378" font-size="14" font-weight="600" fill="#141A21">Ask Outputs</text><text x="644" y="421" font-size="12.5" fill="#46525E">A Build all (Recommended), B</text><text x="644" y="438" font-size="12.5" fill="#46525E">HTML + artifact, C PDF +</text><text x="644" y="455" font-size="12.5" fill="#46525E">artifact, D quick artifact.</text></g><g class="wf-node"><rect x="36" y="586" width="250" height="146" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="602" width="4" height="114" rx="2" fill="#2F6B4F"/><text x="64" y="616" font-size="12" font-weight="600" fill="#46525E">Target</text><text x="64" y="638" font-size="14" font-weight="600" fill="#141A21">Shared post-invocation flow</text><text x="64" y="681" font-size="12.5" fill="#46525E">Chart 2.</text></g><path d="M286,139 L324,139" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-protocols_s2_flows_0-arrow)"/><path d="M576,139 L614,139" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-protocols_s2_flows_0-arrow)"/><path d="M451,214 V399 H161 V584" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-protocols_s2_flows_0-arrow)"/><rect x="241.0" y="375" width="130.0" height="20" rx="10" fill="#FAFCFD" stroke="#C6D1DA"/><text x="306.0" y="389" text-anchor="middle" font-size="12" fill="#141A21">yes, other skill</text><path d="M866,139 L1194,139" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-protocols_s2_flows_0-arrow)"/><path d="M866,13