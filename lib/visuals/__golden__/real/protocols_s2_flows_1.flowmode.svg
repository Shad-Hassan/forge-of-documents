<svg id="flow" class="fm-svg" viewBox="0 0 1192 516" width="1192" height="516" role="img" aria-label="Flowchart: manual steps today, the on-hold API decisions, then the automated target" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="fmNode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F262E"/><stop offset="1" stop-color="#13171C"/></linearGradient><filter id="fmShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".6"/></filter><marker id="fmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA6B0"/></marker></defs><text class="fm-lane" x="1156" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Build</text><text class="fm-lane" x="1156" y="324" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Check and publish</text><g class="fm-node"><rect x="36" y="66" width="250" height="150" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="82" width="4" height="118" rx="2" fill="#9DB4CC"/><text x="64" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Mode or option picked</text></g><g class="fm-node"><rect x="326" y="66" width="250" height="150" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="82" width="4" height="118" rx="2" fill="#7C868E"/><text x="354" y="96" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Artifact-design pass</text><text x="354" y="161" font-size="12.5" fill="#9AA6B0">Platform mechanics. The skill</text><text x="354" y="178" font-size="12.5" fill="#9AA6B0">wins on visual decisions.</text></g><g class="fm-node"><rect x="616" y="66" width="250" height="150" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="630" y="82" width="4" height="118" rx="2" fill="#7C868E"/><text x="644" y="96" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="644" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Build from one script</text><text x="644" y="161" font-size="12.5" fill="#9AA6B0">Plexio: 3 outputs, 4 in hard</text><text x="644" y="178" font-size="12.5" fill="#9AA6B0">mode. Warden: outputs from the</text><text x="644" y="195" font-size="12.5" fill="#9AA6B0">option.</text></g><g class="fm-node"><rect x="36" y="330" width="250" height="150" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="346" width="4" height="118" rx="2" fill="#9DB4CC"/><text x="64" y="360" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="64" y="382" font-size="14" font-weight="600" fill="#E9EDF0">Screenshot asked?</text><text x="64" y="425" font-size="12.5" fill="#9AA6B0">Ask Shad. Never automatic.</text></g><g class="fm-node"><rect x="326" y="330" width="250" height="150" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="346" width="4" height="118" rx="2" fill="#7C868E"/><text x="354" y="360" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="354" y="382" font-size="14" font-weight="600" fill="#E9EDF0">One 375px shot each, fix in</text><text x="354" y="403" font-size="14" font-weight="600" fill="#E9EDF0">one pass</text><text x="354" y="446" font-size="12.5" fill="#9AA6B0">Playwright or Chromium only on</text><text x="354" y="463" font-size="12.5" fill="#9AA6B0">yes.</text></g><g class="fm-node"><rect x="616" y="330" width="250" height="150" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="630" y="346" width="4" height="118" rx="2" fill="#7C868E"/><text x="644" y="360" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="644" y="382" font-size="14" font-weight="600" fill="#E9EDF0">Publish, write .meta.json</text></g><g class="fm-node"><rect x="906" y="330" width="250" height="150" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="920" y="346" width="4" height="118" rx="2" fill="#4E9C74"/><text x="934" y="360" font-size="12" font-weight="600" fill="#7FC29B">Target</text><text x="934" y="382" font-size="14" font-weight="600" fill="#E9EDF0">Report full absolute paths</text></g><path class="fm-edge" d="M286,141 L324,141" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M576,141 L614,141" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M741,218 V273 H161 V328" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M286,405 L324,405" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M286,405 L614,405" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M576,405 L614,405" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M866,405 L904,405" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/></svg>