<svg id="flow-print-shadrian_bliss_cells_2_flow" class="wf-svg" viewBox="0 0 902 474" width="902" height="474" role="img" aria-label="Does this line go in the email?" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-print-shadrian_bliss_cells_2_flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525E"/></marker></defs><text x="866" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Each line</text><text x="866" y="303" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Verdict</text><g class="wf-node"><rect x="36" y="66" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="82" width="4" height="97" rx="2" fill="#2C6488"/><text x="64" y="96" font-size="12" font-weight="600" fill="#46525E">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#141A21">A candidate line</text><text x="64" y="161" font-size="12.5" fill="#46525E">from Shad&#x27;s message or the</text><text x="64" y="178" font-size="12.5" fill="#46525E">record</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="82" width="4" height="97" rx="2" fill="#8DB8D3"/><text x="354" y="96" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="354" y="118" font-size="14" font-weight="600" fill="#141A21">Can leadership act on it?</text><text x="354" y="161" font-size="12.5" fill="#46525E">or does Shad need it said</text></g><g class="wf-node"><rect x="36" y="309" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="325" width="4" height="97" rx="2" fill="#2F6B4F"/><text x="64" y="339" font-size="12" font-weight="600" fill="#46525E">Target</text><text x="64" y="361" font-size="14" font-weight="600" fill="#141A21">Goes in, stated plainly</text>