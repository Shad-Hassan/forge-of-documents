<svg id="flow" class="fm-svg" viewBox="0 0 1482 768" width="1482" height="768" role="img" aria-label="Flowchart: manual steps today, the on-hold API decisions, then the automated target" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="fmNode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F262E"/><stop offset="1" stop-color="#13171C"/></linearGradient><filter id="fmShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".6"/></filter><marker id="fmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA6B0"/></marker></defs><text class="fm-lane" x="1446" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Plexio</text><text class="fm-lane" x="1446" y="320" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Warden</text><text class="fm-lane" x="1446" y="580" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Next</text><g class="fm-node"><rect x="36" y="66" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="82" width="4" height="114" rx="2" fill="#9DB4CC"/><text x="64" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#E9EDF0">/plexio, or any artifact</text><text x="64" y="139" font-size="14" font-weight="600" fill="#E9EDF0">for Shad with no style</text><text x="64" y="160" font-size="14" font-weight="600" fill="#E9EDF0">named</text></g><g class="fm-node"><rect x="326" y="66" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="82" width="4" height="114" rx="2" fill="#9DB4CC"/><text x="354" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="354" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Another house style named?</text><text x="354" y="161" font-size="12.5" fill="#9AA6B0">If yes, that skill runs</text><text x="354" y="178" font-size="12.5" fill="#9AA6B0">instead.</text></g><g class="fm-node"><rect x="616" y="66" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="630" y="82" width="4" height="114" rx="2" fill="#9DB4CC"/><text x="644" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="644" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Mode fits the content?</text><text x="644" y="161" font-size="12.5" fill="#9AA6B0">Hard, note, survey-report,</text><text x="644" y="178" font-size="12.5" fill="#9AA6B0">thread-record, hard-flowmode.</text></g><g class="fm-node"><rect x="906" y="66" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="920" y="82" width="4" height="114" rx="2" fill="#7C868E"/><text x="934" y="96" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="934" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Base patterns</text><text x="934" y="161" font-size="12.5" fill="#9AA6B0">No mode fits: use the base</text><text x="934" y="178" font-size="12.5" fill="#9AA6B0">plexio patterns.</text></g><g class="fm-node"><rect x="1196" y="66" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="1210" y="82" width="4" height="114" rx="2" fill="#4E9C74"/><text x="1224" y="96" font-size="12" font-weight="600" fill="#7FC29B">Target</text><text x="1224" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Mode chosen</text><text x="1224" y="161" font-size="12.5" fill="#9AA6B0">Hard mode is the Synergy</text><text x="1224" y="178" font-size="12.5" fill="#9AA6B0">Universe skin, never warden.</text></g><g class="fm-node"><rect x="36" y="326" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="342" width="4" height="114" rx="2" fill="#9DB4CC"/><text x="64" y="356" font-size="12" font-weight="600" fill="#9DB4CC">Start</text><text x="64" y="378" font-size="14" font-weight="600" fill="#E9EDF0">/warden, or a style word</text></g><g class="fm-node"><rect x="326" y="326" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="342" width="4" height="114" rx="2" fill="#9DB4CC"/><text x="354" y="356" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="354" y="378" font-size="14" font-weight="600" fill="#E9EDF0">Outputs already named?</text></g><g class="fm-node"><rect x="616" y="326" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="630" y="342" width="4" height="114" rx="2" fill="#7C868E"/><text x="644" y="356" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="644" y="378" font-size="14" font-weight="600" fill="#E9EDF0">Ask Outputs</text><text x="644" y="421" font-size="12.5" fill="#9AA6B0">A Build all (Recommended), B</text><text x="644" y="438" font-size="12.5" fill="#9AA6B0">HTML + artifact, C PDF +</text><text x="644" y="455" font-size="12.5" fill="#9AA6B0">artifact, D quick artifact.</text></g><g class="fm-node"><rect x="36" y="586" width="250" height="146" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="602" width="4" height="114" rx="2" fill="#4E9C74"/><text x="64" y="616" font-size="12" font-weight="600" fill="#7FC29B">Target</text><text x="64" y="638" font-size="14" font-weight="600" fill="#E9EDF0">Shared post-invocation flow</text><text x="64" y="681" font-size="12.5" fill="#9AA6B0">Chart 2.</text></g><path class="fm-edge" d="M286,