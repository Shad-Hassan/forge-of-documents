<svg id="flow-cosmic-protocols_s2_flows_0" class="wf-svg" viewBox="0 0 1482 768" width="1482" height="768" role="img" aria-label="Invocation, modes and decision" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-cosmic-protocols_s2_flows_0-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0B6BF"/></marker></defs><text x="1446" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Plexio</text><text x="1446" y="320" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Warden</text><text x="1446" y="580" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Next</text><g class="wf-node"><rect x="36" y="66" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="82" width="4" height="114" rx="2" fill="#5683DA"/><text x="64" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#F5F5F5">/plexio, or any artifact</text><text x="64" y="139" font-size="14" font-weight="600" fill="#F5F5F5">for Shad with no style</text><text x="64" y="160" font-size="14" font-weight="600" fill="#F5F5F5">named</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="340" y="82" width="4" height="114" rx="2" fill="#8FB0F0"/><text x="354" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Decision</text><text x="354" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Another house style named?</text><text x="354" y="161" font-size="12.5" fill="#B0B6BF">If yes, that skill runs</text><text x="354" y="178" font-size="12.5" fill="#B0B6BF">instead.</text></g><g class="wf-node"><rect x="616" y="66" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="630" y="82" width="4" height="114" rx="2" fill="#8FB0F0"/><text x="644" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Decision</text><text x="644" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Mode fits the content?</text><text x="644" y="161" font-size="12.5" fill="#B0B6BF">Hard, note, survey-report,</text><text x="644" y="178" font-size="12.5" fill="#B0B6BF">thread-record, hard-flowmode.</text></g><g class="wf-node"><rect x="906" y="66" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="920" y="82" width="4" height="114" rx="2" fill="#6E86B0"/><text x="934" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Manual</text><text x="934" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Base patterns</text><text x="934" y="161" font-size="12.5" fill="#B0B6BF">No mode fits: use the base</text><text x="934" y="178" font-size="12.5" fill="#B0B6BF">plexio patterns.</text></g><g class="wf-node"><rect x="1196" y="66" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="1210" y="82" width="4" height="114" rx="2" fill="#4FBF8A"/><text x="1224" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Target</text><text x="1224" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Mode chosen</text><text x="1224" y="161" font-size="12.5" fill="#B0B6BF">Hard mode is the Synergy</text><text x="1224" y="178" font-size="12.5" fill="#B0B6BF">Universe skin, never warden.</text></g><g class="wf-node"><rect x="36" y="326" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="342" width="4" height="114" rx="2" fill="#5683DA"/><text x="64" y="356" font-size="12" font-weight="600" fill="#B0B6BF">Start</text><text x="64" y="378" font-size="14" font-weight="600" fill="#F5F5F5">/warden, or a style word</text></g><g class="wf-node"><rect x="326" y="326" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="340" y="342" width="4" height="114" rx="2" fill="#8FB0F0"/><text x="354" y="356" font-size="12" font-weight="600" fill="#B0B6BF">Decision</text><text x="354" y="378" font-size="14" font-weight="600" fill="#F5F5F5">Outputs already named?</text></g><g class="wf-node"><rect x="616" y="326" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="630" y="342" width="4" height="114" rx="2" fill="#6E86B0"/><text x="644" y="356" font-size="12" font-weight="600" fill="#B0B6BF">Manual</text><text x="644" y="378" font-size="14" font-weight="600" fill="#F5F5F5">Ask Outputs</text><text x="644" y="421" font-size="12.5" fill="#B0B6BF">A Build all (Recommended), B</text><text x="644" y="438" font-size="12.5" fill="#B0B6BF">HTML + artifact, C PDF +</text><text x="644" y="455" font-size="12.5" fill="#B0B6BF">artifact, D quick artifact.</text></g><g class="wf-node"><rect x="36" y="586" width="250" height="146" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="602" width="4" height="114" rx="2" fill="#4FBF8A"/><text x="64" y="616" font-size="12" font-weight="600" fill="#B0B6BF">Target</text><text x="64" y="638" font-size="14" font-weight="600" fill="#F5F5F5">Shared post-invocation flow</text><text x="64" y="681" font-size="12.5" fill="#B0B6BF">Chart 2.</text></g><path d="M286,139 L324,139" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-protocols_s2_flows_0-arrow)"/><path d="M576,139 L614,139" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-protocols_s2_flows_0-arrow)"/><path d="M451,214 V399 H161 V584" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-protocols_s2_flows_0-arrow)"/><rect x="241.0" y="375" width="130.0" height="20" rx="10" fill="#111317" stroke="#2A2E35"/><text x="306.0" y="389" text-anchor="middle" font-size="12" fill="#F5F5F5">yes, other skill</text><path d="M866,139 L1194,139" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-protocols_s2_flows_0-arrow)"/><path d="M