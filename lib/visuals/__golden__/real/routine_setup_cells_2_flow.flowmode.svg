itadel</text><text x="64" y="386" font-size="14" font-weight="600" fill="#E9EDF0">root?</text><text x="64" y="429" font-size="12.5" fill="#9AA6B0">must exist</text></g><g class="fm-node"><rect x="326" y="313" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="329" width="4" height="101" rx="2" fill="#9DB4CC"/><text x="354" y="343" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="354" y="365" font-size="14" font-weight="600" fill="#E9EDF0">Target folder already</text><text x="354" y="386" font-size="14" font-weight="600" fill="#E9EDF0">there?</text><text x="354" y="429" font-size="12.5" fill="#9AA6B0">parent/repo</text></g><g class="fm-node"><rect x="36" y="560" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="576" width="4" height="101" rx="2" fill="#C99A3E"/><text x="64" y="590" font-size="12" font-weight="600" fill="#E0B46A">On hold</text><text x="64" y="612" font-size="14" font-weight="600" fill="#E9EDF0">Refused</text><text x="64" y="655" font-size="12.5" fill="#9AA6B0">400 or 409, nothing cloned</text></g><g class="fm-node"><rect x="326" y="560" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="576" width="4" height="101" rx="2" fill="#4E9C74"/><text x="354" y="590" font-size="12" font-weight="600" fill="#7FC29B">Target</text><text x="354" y="612" font-size="14" font-weight="600" fill="#E9EDF0">Cloned</text><text x="354" y="655" font-size="12.5" fill="#9AA6B0">ok true, target path returned</text></g><path class="fm-edge" d="M161,201 V256 H161 V311" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M286,379 L324,379" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm