<svg id="flow" class="fm-svg" viewBox="0 0 612 440" width="612" height="440" role="img" aria-label="Flowchart: manual steps today, the on-hold API decisions, then the automated target" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="fmNode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F262E"/><stop offset="1" stop-color="#13171C"/></linearGradient><filter id="fmShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".6"/></filter><marker id="fmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA6B0"/></marker></defs><text class="fm-lane" x="576" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">This machine</text><text class="fm-lane" x="576" y="286" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">GitHub</text><g class="fm-node"><rect x="36" y="66" width="250" height="112" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="82" width="4" height="80" rx="2" fill="#9DB4CC"/><text x="64" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#E9EDF0">ops/.env</text><text x="64" y="161" font-size="12.5" fill="#9AA6B0">GITHUB_TOKEN, gitignored</text></g><g class="fm-node"><rect x="326" y="66" width="250" height="112" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="82" width="4" height="80" rx="2" fill="#7C868E"/><text x="354" y="96" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Local server</text><text x="354" y="161" font-size="12.5" fill="#9AA6B0">127.0.0.1:8787, reads the token</text></g><g class="fm-node"><rect x="36" y="292" width="250" height="112" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="308" width="4" height="80" rx="2" fill="#4E9C74"/><text x="64" y="322" font-size="12" font-weight="600" fill="#7FC29B">Target</text><text x="64" y="344" font-size="14" font-weight="600" fill="#E9EDF0">GitHub</text><text x="64" y="387" font-size="12.5" fill="#9AA6B0">token sent by the server only</text></g><path class="fm-edge" d="M286,122 L324,122" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M451,180 V235 H161 V290" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><rect x="224.4" y="211" width="163.2" height="20" rx="10" fill="#0A0B0D"/><text x="306.0" y="225" text-anchor="middle" font-size="12" fill="#C9D1D8">API and git over HTTPS</text></svg>