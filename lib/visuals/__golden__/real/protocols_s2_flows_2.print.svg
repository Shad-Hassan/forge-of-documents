<svg id="flow-print-protocols_s2_flows_2" class="wf-svg" viewBox="0 0 1192 474" width="1192" height="474" role="img" aria-label="After publish or wrap" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-print-protocols_s2_flows_2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525E"/></marker></defs><text x="1156" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Publish</text><text x="1156" y="303" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Wrap</text><g class="wf-node"><rect x="36" y="66" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="82" width="4" height="97" rx="2" fill="#2C6488"/><text x="64" y="96" font-size="12" font-weight="600" fill="#46525E">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#141A21">Page published</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="82" width="4" height="97" rx="2" fill="#5E7A96"/><text x="354" y="96" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#141A21">Warden: Sealed band</text><text x="354" y="161" font-size="12.5" fill="#46525E">Who forged it, from what, date,</text><text x="354" y="178" font-size="12.5" fill="#46525E">version.</text></g><g class="wf-node"><rect x="616" y="66" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="630" y="82" width="4" height="97" rx="2" fill="#8DB8D3"/><text x="644" y="96" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="644" y="118" font-size="14" font-weight="600" fill="#141A21">Wrap requested?</text></g><g class="wf-node"><rect x="36" y="309" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="325" width="4" height="97" rx="2" fill="#5E7A96"/><text x="64" y="339" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="64" y="361" font-size="14" font-weight="600" fill="#141A21">/handoff quickcast</text><text x="64" y="404" font-size="12.5" fill="#46525E">Capture only.</text></g><g class="wf-node"><rect x="326" y="309" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="325" width="4" height="97" rx="2" fill="#5E7A96"/><text x="354" y="339" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="354" y="361" font-size="14" font-weight="600" fill="#141A21">/handoff cc</text><text x="354" y="404" font-size="12.5" fill="#46525E">List what is open, then normal.</text></g><g class="wf-node"><rect x="616" y="309" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="630" y="325" width="4" height="97" rx="2" fill="#5E7A96"/><text x="644" y="339" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="644" y="361" font-size="14" font-weight="600" fill="#141A21">/handoff normal</text><text x="644" y="404" font-size="12.5" fill="#46525E">Capture, stop-notes, memory,</text><text x="644" y="421" font-size="12.5" fill="#46525E">git if enabled.</text></g><g class="wf-node"><rect x="906" y="309" width="250" height="129" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="920" y="325" width="4" height="97" rx="2" fill="#2F6B4F"/><text x="934" y="339" font-size="12" font-weight="600" fill="#46525E">Target</text><text x="934" y="361" font-size="14" font-weight="600" fill="#141A21">Type /compact or /clear</text><text x="934" y="404" font-size="12.5" fill="#46525E">Hooks capture the session</text><text x="934" y="421" font-size="12.5" fill="#46525E">anyway.</text></g><path d="M286,130 L324,130" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-protocols_s2_flows_2-arrow)"/><path d="M576,130 L614,130" fill="none" stroke="#46525E" stroke-o