<svg id="flow-print-routine_setup_cells_2_flow" class="wf-svg" viewBox="0 0 612 729" width="612" height="729" role="img" aria-label="Clone" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-print-routine_setup_cells_2_flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525E"/></marker></defs><text x="576" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Request</text><text x="576" y="307" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Checks</text><text x="576" y="554" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Result</text><g class="wf-node"><rect x="36" y="66" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="82" width="4" height="101" rx="2" fill="#2C6488"/><text x="64" y="96" font-size="12" font-weight="600" fill="#46525E">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#141A21">POST /api/git/clone</text><text x="64" y="161" font-size="12.5" fill="#46525E">owner, repo, parent</text></g><g class="wf-node"><rect x="36" y="313" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="329" width="4" height="101" rx="2" fill="#8DB8D3"/><text x="64" y="343" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="64" y="365" font-size="14" font-weight="600" fill="#141A21">Parent under the citadel</text><text x="64" y="386" font-size="14" font-weight="600" fill="#141A21">root?</text><text x="64" y="429" font-size="12.5" fill="#46525E">must exist</text></g><g class="wf-node"><rect x="326" y="313" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="329" width="4" height="101" rx="2" fill="#8DB8D3"/><text x="354" y="343" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="354" y="365" font-size="