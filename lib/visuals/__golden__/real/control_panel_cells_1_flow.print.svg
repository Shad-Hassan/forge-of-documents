<svg id="flow-print-control_panel_cells_1_flow" class="wf-svg" viewBox="0 0 902 666" width="902" height="666" role="img" aria-label="Who reads ops/.env" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-print-control_panel_cells_1_flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525E"/></marker></defs><text x="866" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Source</text><text x="866" y="286" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Readers</text><text x="866" y="512" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Reaches</text><g class="wf-node"><rect x="36" y="66" width="250" height="112" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="82" width="4" height="80" rx="2" fill="#2C6488"/><text x="64" y="96" font-size="12" font-weight="600" fill="#46525E">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#141A21">ops/.env</text><text x="64" y="161" font-size="12.5" fill="#46525E">Local only, never in git</text></g><g class="wf-node"><rect x="36" y="292" width="250" height="112" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="308" width="4" height="80" rx="2" fill="#5E7A96"/><text x="64" y="322" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="64" y="344" font-size="14" font-weight="600" fill="#141A21">Hono server</text><text x="64" y="387" font-size="12.5" fill="#46525E">--env-file-if-exists</text></g><g class="wf-node"><rect x="326" y="292" width="250" height="112" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="308" width="4" height="80" rx="2" fill="#5E7A96"/><text x="354" y="322" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="354" y="344" font-size="14" font-weight="600" fill="#141A21">npm run cli -- &lt;tool&gt;</text><text x="354