<svg id="flow-cosmic-shadrian_bliss_cells_2_flow" class="wf-svg" viewBox="0 0 902 474" width="902" height="474" role="img" aria-label="Does this line go in the email?" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-cosmic-shadrian_bliss_cells_2_flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0B6BF"/></marker></defs><text x="866" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Each line</text><text x="866" y="303" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Verdict</text><g class="wf-node"><rect x="36" y="66" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="82" width="4" height="97" rx="2" fill="#5683DA"/><text x="64" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#F5F5F5">A candidate line</text><text x="64" y="161" font-size="12.5" fill="#B0B6BF">from Shad&#x27;s message or the</text><text x="64" y="178" font-size="12.5" fill="#B0B6BF">record</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="340" y="82" width="4" height="97" rx="2" fill="#8FB0F0"/><text x="354" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Decision</text><text x="354" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Can leadership act on it?</text><text x="354" y="161" font-size="12.5" fill="#B0B6BF">or does Shad need it said</text></g><g class="wf-node"><rect x="36" y="309" width="250" height="129" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="325" width="4" height="97" rx="2" fill="#4FBF8A"/><text x="64" y="339" font-size="12" font-weight="600" fill="#B0B6BF">Target</text><text x="64" y="361" font-size="14" font-weight="600" fill="#F5F5F5">Goes in, stated plainly</tex