<svg id="flow" class="fm-svg" viewBox="0 0 902 717" width="902" height="717" role="img" aria-label="Flowchart: manual steps today, the on-hold API decisions, then the automated target" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="fmNode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F262E"/><stop offset="1" stop-color="#13171C"/></linearGradient><filter id="fmShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".6"/></filter><marker id="fmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA6B0"/></marker></defs><text class="fm-lane" x="866" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Shad</text><text class="fm-lane" x="866" y="303" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Claude</text><text class="fm-lane" x="866" y="546" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Out</text><g class="fm-node"><rect x="36" y="66" width="250" height="129" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="82" width="4" height="97" rx="2" fill="#9DB4CC"/><text x="64" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Types /shadrian-bliss</text><text x="64" y="161" font-size="12.5" fill="#9AA6B0">or asks for a leadership status</text><text x="64" y="178" font-size="12.5" fill="#9AA6B0">email</text></g><g class="fm-node"><rect x="326" y="66" width="250" height="129" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="82" width="4" height="97" rx="2" fill="#7C868E"/><text x="354" y="96" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Gives the facts</text><text x="354" y="161" font-size="12.5" fill="#9AA6B0">his message, or the record</text></g><g class="fm-node"><rect x="36" y="309" width="250" height="129" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="325" width="4" height="97" rx="2" fill="#7C868E"/><text x="64" y="339" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="64" y="361" font-size="14" font-weight="600" fill="#E9EDF0">Drafts the email</text><text x="64" y="404" font-size="12.5" fill="#9AA6B0">Hello team, then Done, Waiting</text><text x="64" y="421" font-size="12.5" fill="#9AA6B0">on, Next</text></g><g class="fm-node"><rect x="326" y="309" width="250" height="129" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="325" width="4" height="97" rx="2" fill="#9DB4CC"/><text x="354" y="339" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="354" y="361" font-size="14" font-weight="600" fill="#E9EDF0">Waiting on in play?</text><text x="354" y="404" font-size="12.5" fill="#9AA6B0">asks Shad one item at a time</text></g><g class="fm-node"><rect x="616" y="309" width="250" height="129" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="630" y="325" width="4" height="97" rx="2" fill="#7C868E"/><text x="644" y="339" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="644" y="361" font-size="14" font-weight="600" fill="#E9EDF0">Checks every line</text><text x="644" y="404" font-size="12.5" fill="#9AA6B0">source, no apology, no private</text><text x="644" y="421" font-size="12.5" fill="#9AA6B0">context</text></g><g class="fm-node"><rect x="36" y="552" width="250" height="129" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="568" width="4" height="97" rx="2" fill="#4E9C74"/><text x="64" y="582" font-size="12" font-weight="600" fill="#7FC29B">Target</text><text x="64" y="604" font-size="14" font-weight="600" fill="#E9EDF0">Pastes the email in chat</text><text x="64" y="647" font-size="12.5" fill="#9AA6B0">and writes the file</text></g><path class="fm-edge" d="M286,130 L324,130" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M451,197 V252 H161 V307" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M286,373 L324,373" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M576,373 L614,373" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M741,440 V495 H161 V550" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/></svg>