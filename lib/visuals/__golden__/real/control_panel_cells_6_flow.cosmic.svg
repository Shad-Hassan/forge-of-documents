<svg id="flow-cosmic-control_panel_cells_6_flow" class="wf-svg" viewBox="0 0 612 666" width="612" height="666" role="img" aria-label="Linking each CLI" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-cosmic-control_panel_cells_6_flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0B6BF"/></marker></defs><text x="576" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Run</text><text x="576" y="286" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Token</text><text x="576" y="512" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Link state</text><g class="wf-node"><rect x="36" y="66" width="250" height="112" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="82" width="4" height="80" rx="2" fill="#5683DA"/><text x="64" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#F5F5F5">npm run cli -- supabase</text><text x="64" y="139" font-size="14" font-weight="600" fill="#F5F5F5">link</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="112" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="340" y="82" width="4" height="80" rx="2" fill="#5683DA"/><text x="354" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Start</text><text x="354" y="118" font-size="14" font-weight="600" fill="#F5F5F5">npm run cli -- vercel link</text></g><g class="wf-node"><rect x="36" y="292" width="250" height="112" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="308" width="4" height="80" rx="2" fill="#6E86B0"/><text x="64" y="322" font-size="12" font-weight="600" fill="#B0B6BF">Manual</text><text x="64" y="344" font-size="14" font-weight="600" fill="#F5F5F5">SUPABASE_ACCESS_TOKEN</text><text x="64" y="387" font-size="12.5" fill="#B0B6BF">From ops/.env</text></g><