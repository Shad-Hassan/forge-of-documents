<svg id="flow" class="fm-svg" viewBox="0 0 902 729" width="902" height="729" role="img" aria-label="Flowchart: manual steps today, the on-hold API decisions, then the automated target" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="fmNode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F262E"/><stop offset="1" stop-color="#13171C"/></linearGradient><filter id="fmShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".6"/></filter><marker id="fmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA6B0"/></marker></defs><text class="fm-lane" x="866" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Pick</text><text class="fm-lane" x="866" y="307" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Gate</text><text class="fm-lane" x="866" y="554" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Record</text><g class="fm-node"><rect x="36" y="66" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="82" width="4" height="101" rx="2" fill="#9DB4CC"/><text x="64" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#E9EDF0">You pick an action</text></g><g class="fm-node"><rect x="326" y="66" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="82" width="4" height="101" rx="2" fill="#7C868E"/><text x="354" y="96" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Server maps it to fixed</text><text x="354" y="139" font-size="14" font-weight="600" fill="#E9EDF0">args</text><text x="354" y="182" font-size="12.5" fill="#9AA6B0">Never a shell string</text></g><g class="fm-node"><rect x="616" y="66" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="630" y="82" width="4" height="101" rx="2" fill="#9DB4CC"/><text x="644" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="644" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Read or write?</text></g><g class="fm-node"><rect x="36" y="313" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="329" width="4" height="101" rx="2" fill="#7C868E"/><text x="64" y="343" font-size="12" font-weight="600" fill="#9AA6B0">Read</text><text x="64" y="365" font-size="14" font-weight="600" fill="#E9EDF0">Runs on click</text></g><g class="fm-node"><rect x="326" y="313" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="329" width="4" height="101" rx="2" fill="#7C868E"/><text x="354" y="343" font-size="12" font-weight="600" fill="#9AA6B0">Write</text><text x="354" y="365" font-size="14" font-weight="600" fill="#E9EDF0">Preview shown</text></g><g class="fm-node"><rect x="616" y="313" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="630" y="329" width="4" height="101" rx="2" fill="#9DB4CC"/><text x="644" y="343" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="644" y="365" font-size="14" font-weight="600" fill="#E9EDF0">You approve?</text></g><g class="fm-node"><rect x="36" y="560" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="576" width="4" height="101" rx="2" fill="#4E9C74"/><text x="64" y="590" font-size="12" font-weight="600" fill="#7FC29B">Target</text><text x="64" y="612" font-size="14" font-weight="600" fill="#E9EDF0">Runs, result logged</text></g><g class="fm-node"><rect x="326" y="560" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="576" width="4" height="101" rx="2" fill="#C99A3E"/><text x="354" y="590" font-size="12" font-weight="600" fill="#E0B46A">Later</text><text x="354" y="612" font-size="14" font-weight="600" fill="#E9EDF0">Game layer scores the log</text></g><g class="fm-node"><rect x="616" y="560" width="250" height="133" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="630" y="576" width="4" height="101" rx="2" fill="#C99A3E"/><text x="644" y="590" font-size="12" font-weight="600" fill="#E0B46A">Rejected</text><text x="644" y="612" font-size="14" font-weight="600" fill="#E9EDF0">Logged, nothing runs</text></g><path class="fm-edge" d="M286,132 L324,132" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M576,132 L614,132" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M741,201 V256 H161 V311" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><rect x="428.8" y="232" width="44.4" height="20" rx="10" fill="#0A0B0D"/><text x="451.0" y="246" text-anchor="middle" font-size="12" fill="#C9D1D8">read</text><path class="fm-edge" d="M741,201 V256 H451 V311" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><rect x="570.5" y="232" width="51.0" height="20" rx="10" fill="#0A0B0D"/><text x="596.0" y="246" text-anchor="middle" font-size="12" fill="#C9D1D8">write</text><path class="fm-edge" d="M576,379 L614,379" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M161,448 V503 H161 V558" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M741,448 V503 H161 V558" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><rect x="432.1" y="479" width="37.8" height="20" rx="10" fill="#0A0B0D"/><text x="451.0" y="493" text-anchor="middle" font-size="12" fill="#C9D1D8">yes</text><path class="fm-edge" d="M741,448 V503 H741 V558" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><rect x="725.4" y="479" width="31.2" height="20" rx="10" fill="#0A0B0D"/><text x="741.0" y="493" text-anchor="middle" font-size="12" fill="#C9D1D8">no</text><path class="fm-edge" d="M286,626 L324,626" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/></svg>