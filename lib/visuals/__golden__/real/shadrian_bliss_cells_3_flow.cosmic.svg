<svg id="flow-cosmic-shadrian_bliss_cells_3_flow" class="wf-svg" viewBox="0 0 902 482" width="902" height="482" role="img" aria-label="The Waiting on loop" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-cosmic-shadrian_bliss_cells_3_flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0B6BF"/></marker></defs><text x="866" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Per item</text><text x="866" y="307" text-anchor="end" font-size="13" font-weight="600" fill="#B0B6BF">Outcome</text><g class="wf-node"><rect x="36" y="66" width="250" height="133" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="82" width="4" height="101" rx="2" fill="#5683DA"/><text x="64" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Next item</text><text x="64" y="161" font-size="12.5" fill="#B0B6BF">token, sign-in, keys, template</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="133" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="340" y="82" width="4" height="101" rx="2" fill="#6E86B0"/><text x="354" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#F5F5F5">Ask three short questions</text><text x="354" y="161" font-size="12.5" fill="#B0B6BF">in hand? where? who acts?</text></g><g class="wf-node"><rect x="616" y="66" width="250" height="133" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="630" y="82" width="4" height="101" rx="2" fill="#8FB0F0"/><text x="644" y="96" font-size="12" font-weight="600" fill="#B0B6BF">Decision</text><text x="644" y="118" font-size="14" font-weight="600" fill="#F5F5F5">What does Shad say?</text><text x="644" y="161" font-size="12.5" fill="#B0B6BF">his answer decides the line</text></g><g class="wf-node"><rect x="36" y="313" width="250" height="133" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="50" y="329" width="4" height="101" rx="2" fill="#4FBF8A"/><text x="64" y="343" font-size="12" font-weight="600" fill="#B0B6BF">Target</text><text x="64" y="365" font-size="14" font-weight="600" fill="#F5F5F5">In hand: leaves Waiting on</text><text x="64" y="408" font-size="12.5" fill="#B0B6BF">Done only in his wording</text></g><g class="wf-node"><rect x="326" y="313" width="250" height="133" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="340" y="329" width="4" height="101" rx="2" fill="#E3B45A"/><text x="354" y="343" font-size="12" font-weight="600" fill="#B0B6BF">On hold</text><text x="354" y="365" font-size="14" font-weight="600" fill="#F5F5F5">Still articulating: stays</text><text x="354" y="408" font-size="12.5" fill="#B0B6BF">no guess fills the gap</text></g><g class="wf-node"><rect x="616" y="313" width="250" height="133" rx="16" fill="#111317" stroke="#2A2E35"/><rect x="630" y="329" width="4" height="101" rx="2" fill="#6E86B0"/><text x="644" y="343" font-size="12" font-weight="600" fill="#B0B6BF">Manual</text><text x="644" y="365" font-size="14" font-weight="600" fill="#F5F5F5">Resolved or a mix-up:</text><text x="644" y="386" font-size="14" font-weight="600" fill="#F5F5F5">leaves</text><text x="644" y="429" font-size="12.5" fill="#B0B6BF">not mentioned in the email</text></g><path d="M286,132 L324,132" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_3_flow-arrow)"/><path d="M576,132 L614,132" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_3_flow-arrow)"/><path d="M741,201 V256 H161 V311" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_3_flow-arrow)"/><rect x="417.5" y="232" width="67.0" height="20" rx="10" fill="#111317" stroke="#2A2E35"/><text x="451.0" y="246" text-anchor="middle" font-size="12" fill="#F5F5F5">in hand</text><path d="M741,201 V256 H451 V311" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_3_flow-arrow)"/><rect x="545.0" y="232" width="102.0" height="20" rx="10" fill="#111317" stroke="#2A2E35"/><text x="596.0" y="246" text-anchor="middle" font-size="12" fill="#F5F5F5">articulating</text><path d="M741,201 V256 H741 V311" fill="none" stroke="#B0B6BF" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-cosmic-shadrian_bliss_cells_3_flow-arrow)"/><rect x="704.0" y="232" width="74.0" height="20" rx="10" fill="#111317" stroke="#2A2E35"/><text x="741.0" y="246" text-anchor="middle" font-size="12" fill="#F5F5F5">resolved</text></svg>