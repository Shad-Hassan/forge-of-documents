<svg id="flow-print-control_panel_cells_2_flow" class="wf-svg" viewBox="0 0 902 729" width="902" height="729" role="img" aria-label="Human in the loop" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="flow-print-control_panel_cells_2_flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525E"/></marker></defs><text x="866" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Pick</text><text x="866" y="307" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Gate</text><text x="866" y="554" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Record</text><g class="wf-node"><rect x="36" y="66" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="82" width="4" height="101" rx="2" fill="#2C6488"/><text x="64" y="96" font-size="12" font-weight="600" fill="#46525E">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#141A21">You pick an action</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="82" width="4" height="101" rx="2" fill="#5E7A96"/><text x="354" y="96" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#141A21">Server maps it to fixed</text><text x="354" y="139" font-size="14" font-weight="600" fill="#141A21">args</text><text x="354" y="182" font-size="12.5" fill="#46525E">Never a shell string</text></g><g class="wf-node"><rect x="616" y="66" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="630" y="82" width="4" height="101" rx="2" fill="#8DB8D3"/><text x="644" y="96" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="644" y="118" font-size="14" font-weight="600" fill="#141A21">Read or write?</text></g><g class="wf-node"><rect x="36" y="313" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="329" width="4" height="101" rx="2" fill="#5E7A96"/><text x="64" y="343" font-size="12" font-weight="600" fill="#46525E">Read</text><text x="64" y="365" font-size="14" font-weight="600" fill="#141A21">Runs on click</text></g><g class="wf-node"><rect x="326" y="313" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="329" width="4" height="101" rx="2" fill="#5E7A96"/><text x="354" y="343" font-size="12" font-weight="600" fill="#46525E">Write</text><text x="354" y="365" font-size="14" font-weight="600" fill="#141A21">Preview shown</text></g><g class="wf-node"><rect x="616" y="313" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="630" y="329" width="4" height="101" rx="2" fill="#8DB8D3"/><text x="644" y="343" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="644" y="365" font-size="14" font-weight="600" fill="#141A21">You approve?</text></g><g class="wf-node"><rect x="36" y="560" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="576" width="4" height="101" rx="2" fill="#2F6B4F"/><text x="64" y="590" font-size="12" font-weight="600" fill="#46525E">Target</text><text x="64" y="612" font-size="14" font-weight="600" fill="#141A21">Runs, result logged</text></g><g class="wf-node"><rect x="326" y="560" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="576" width="4" height="101" rx="2" fill="#8A6414"/><text x="354" y="590" font-size="12" font-weight="600" fill="#46525E">Later</text><text x="354" y="612" font-size="14" font-weight="600" fill="#141A21">Game layer scores the log</text></g><g class="wf-node"><rect x="616" y="560" width="250" height="133" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="630" y="576" width="4" height="101" rx="2" fill="#8A6414"/><text x="644" y="590" font-size="12" font-weight="600" fill="#46525E">Rejected</text><text x="644" y="612" font-size="14" font-weight="600" fill="#141A21">Logged, nothing runs</text></g><path d="M286,132 L324,132" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-control_panel_cells_2_flow-arrow)"/><path d="M576,132 L614,132" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-control_panel_cells_2_flow-arrow)"/><path d="M741,201 V256 H161 V311" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-control_panel_cells_2_flow-arrow)"/><rect x="428.0" y="232" width="46.0" height="20" rx="10" fill="#FAFCFD" stroke="#C6D1DA"/><text x="451.0" y="246" text-anchor="middle" font-size="12" fill="#141A21">read</text><path d="M741,201 V256 H451 V311" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-control_panel_cells_2_flow-arrow)"/><rect x="569.5" y="232" width="53.0" height="20" rx="10" fill="#FAFCFD" stroke="#C6D1DA"/><text x="596.0" y="246" text-anchor="middle" font-size="12" fill="#141A21">write</text><path d="M576,379 L614,379" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-control_panel_cells_2_flow-arrow)"/><path d="M161,448 V503 H161 V558" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-control_panel_cells_2_flow-arrow)"/><path d="M741,448 V503 H161 V558" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-control_panel_cells_2_flow-arrow)"/><rect x="431.5" y="479" width="39.0" height="20" rx="10" fill="#FAFCFD" stroke="#C6D1DA"/><text x="451.0" y="493" text-anchor="middle" font-size="12" fill="#141A21">yes</text><path d="M741,448 V503 H741 V558" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#flow-print-control_panel_cells_2_flow-arrow)"/><rect x="725.0" y="479" width="32.0" he