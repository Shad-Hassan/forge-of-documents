<svg id="flow" class="fm-svg" viewBox="0 0 612 843" width="612" height="843" role="img" aria-label="Flowchart: manual steps today, the on-hold API decisions, then the automated target" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="fmNode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F262E"/><stop offset="1" stop-color="#13171C"/></linearGradient><filter id="fmShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".6"/></filter><marker id="fmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA6B0"/></marker></defs><text class="fm-lane" x="576" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Intake &amp; triage</text><text class="fm-lane" x="576" y="345" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Review</text><text class="fm-lane" x="576" y="630" text-anchor="end" font-size="13" font-weight="600" fill="#9AA6B0">Done &amp; automated</text><g class="fm-node"><rect x="36" y="66" width="250" height="171" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="82" width="4" height="139" rx="2" fill="#9DB4CC"/><text x="64" y="96" font-size="12" font-weight="600" fill="#9DB4CC">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Request arrives from the</text><text x="64" y="139" font-size="14" font-weight="600" fill="#E9EDF0">team &amp; ops inbox with a</text><text x="64" y="160" font-size="14" font-weight="600" fill="#E9EDF0">long descriptive title that</text><text x="64" y="181" font-size="14" font-weight="600" fill="#E9EDF0">must wrap across several</text><text x="64" y="202" font-size="14" font-weight="600" fill="#E9EDF0">lines</text></g><g class="fm-node"><rect x="326" y="66" width="250" height="171" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="82" width="4" height="139" rx="2" fill="#7C868E"/><text x="354" y="96" font-size="12" font-weight="600" fill="#9AA6B0">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#E9EDF0">Check the calendar &amp; guests</text><text x="354" y="161" font-size="12.5" fill="#9AA6B0">Read every attendee list &amp;</text><text x="354" y="178" font-size="12.5" fill="#9AA6B0">confirm the Meet link before</text><text x="354" y="195" font-size="12.5" fill="#9AA6B0">anything moves</text></g><g class="fm-node"><rect x="36" y="351" width="250" height="171" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="367" width="4" height="139" rx="2" fill="#9DB4CC"/><text x="64" y="381" font-size="12" font-weight="600" fill="#9DB4CC">Decision</text><text x="64" y="403" font-size="14" font-weight="600" fill="#E9EDF0">Approve &amp; sign off</text><text x="64" y="446" font-size="12.5" fill="#9AA6B0">Owner decides, or it goes</text><text x="64" y="463" font-size="12.5" fill="#9AA6B0">quietly to the team</text></g><g class="fm-node"><rect x="326" y="351" width="250" height="171" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="367" width="4" height="139" rx="2" fill="#C99A3E"/><text x="354" y="381" font-size="12" font-weight="600" fill="#E0B46A">On hold</text><text x="354" y="403" font-size="14" font-weight="600" fill="#E9EDF0">Waiting on the vendor API</text><text x="354" y="446" font-size="12.5" fill="#9AA6B0">Blocked until the API key</text><text x="354" y="463" font-size="12.5" fill="#9AA6B0">arrives</text></g><g class="fm-node"><rect x="36" y="636" width="250" height="171" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="50" y="652" width="4" height="139" rx="2" fill="#4E9C74"/><text x="64" y="666" font-size="12" font-weight="600" fill="#7FC29B">Auto</text><text x="64" y="688" font-size="14" font-weight="600" fill="#E9EDF0">One consistent event for</text><text x="64" y="709" font-size="14" font-weight="600" fill="#E9EDF0">everyone</text></g><g class="fm-node"><rect x="326" y="636" width="250" height="171" rx="16" fill="url(#fmNode)" stroke="#E9EDF0" stroke-opacity=".14" filter="url(#fmShadow)"/><rect x="340" y="652" width="4" height="139" rx="2" fill="#4E9C74"/><text x="354" y="666" font-size="12" font-weight="600" fill="#7FC29B">Target</text><text x="354" y="688" font-size="14" font-weight="600" fill="#E9EDF0">Confirm &amp; notify the team</text></g><path class="fm-edge" d="M286,151 L324,151" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M451,239 V294 H161 V349" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><rect x="247.5" y="270" width="117.0" height="20" rx="10" fill="#0A0B0D"/><text x="306.0" y="284" text-anchor="middle" font-size="12" fill="#C9D1D8">Ready &amp; checked</text><path class="fm-edge" d="M286,436 L324,436" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M451,524 V579 H161 V634" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><rect x="267.3" y="555" width="77.4" height="20" rx="10" fill="#0A0B0D"/><text x="306.0" y="569" text-anchor="middle" font-size="12" fill="#C9D1D8">Unblocked</text><path class="fm-edge" d="M286,721 L324,721" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><path class="fm-edge" d="M161,239 V294 H161 V349" fill="none" stroke="#9AA6B0" stroke-opacity=".7" stroke-width="1.6" marker-end="url(#fmArrow)"/><rect x="122.3" y="270" width="77.4" height="20" rx="10" fill="#0A0B0D"/><text x="161.0" y="284" text-anchor="middle" font-size="12" fill="#C9D1D8">Fast path</text></svg>