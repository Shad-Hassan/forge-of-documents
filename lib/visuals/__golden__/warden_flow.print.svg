<svg id="wf-golden" class="wf-svg" viewBox="0 0 612 843" width="612" height="843" role="img" aria-label="Golden flow" xmlns="http://www.w3.org/2000/svg" font-family="Inter, IBM Plex Sans, Helvetica, Arial, sans-serif"><defs><marker id="wf-golden-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525E"/></marker></defs><text x="576" y="60" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Intake &amp; triage</text><text x="576" y="345" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Review</text><text x="576" y="630" text-anchor="end" font-size="13" font-weight="600" fill="#46525E">Done &amp; automated</text><g class="wf-node"><rect x="36" y="66" width="250" height="171" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="82" width="4" height="139" rx="2" fill="#2C6488"/><text x="64" y="96" font-size="12" font-weight="600" fill="#46525E">Start</text><text x="64" y="118" font-size="14" font-weight="600" fill="#141A21">Request arrives from the</text><text x="64" y="139" font-size="14" font-weight="600" fill="#141A21">team &amp; ops inbox with a</text><text x="64" y="160" font-size="14" font-weight="600" fill="#141A21">long descriptive title that</text><text x="64" y="181" font-size="14" font-weight="600" fill="#141A21">must wrap across several</text><text x="64" y="202" font-size="14" font-weight="600" fill="#141A21">lines</text></g><g class="wf-node"><rect x="326" y="66" width="250" height="171" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="82" width="4" height="139" rx="2" fill="#5E7A96"/><text x="354" y="96" font-size="12" font-weight="600" fill="#46525E">Manual</text><text x="354" y="118" font-size="14" font-weight="600" fill="#141A21">Check the calendar &amp; guests</text><text x="354" y="161" font-size="12.5" fill="#46525E">Read every attendee list &amp;</text><text x="354" y="178" font-size="12.5" fill="#46525E">confirm the Meet link before</text><text x="354" y="195" font-size="12.5" fill="#46525E">anything moves</text></g><g class="wf-node"><rect x="36" y="351" width="250" height="171" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="367" width="4" height="139" rx="2" fill="#8DB8D3"/><text x="64" y="381" font-size="12" font-weight="600" fill="#46525E">Decision</text><text x="64" y="403" font-size="14" font-weight="600" fill="#141A21">Approve &amp; sign off</text><text x="64" y="446" font-size="12.5" fill="#46525E">Owner decides, or it goes</text><text x="64" y="463" font-size="12.5" fill="#46525E">quietly to the team</text></g><g class="wf-node"><rect x="326" y="351" width="250" height="171" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="367" width="4" height="139" rx="2" fill="#8A6414"/><text x="354" y="381" font-size="12" font-weight="600" fill="#46525E">On hold</text><text x="354" y="403" font-size="14" font-weight="600" fill="#141A21">Waiting on the vendor API</text><text x="354" y="446" font-size="12.5" fill="#46525E">Blocked until the API key</text><text x="354" y="463" font-size="12.5" fill="#46525E">arrives</text></g><g class="wf-node"><rect x="36" y="636" width="250" height="171" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="50" y="652" width="4" height="139" rx="2" fill="#2F6B4F"/><text x="64" y="666" font-size="12" font-weight="600" fill="#46525E">Auto</text><text x="64" y="688" font-size="14" font-weight="600" fill="#141A21">One consistent event for</text><text x="64" y="709" font-size="14" font-weight="600" fill="#141A21">everyone</text></g><g class="wf-node"><rect x="326" y="636" width="250" height="171" rx="16" fill="#FAFCFD" stroke="#C6D1DA"/><rect x="340" y="652" width="4" height="139" rx="2" fill="#2F6B4F"/><text x="354" y="666" font-size="12" font-weight="600" fill="#46525E">Target</text><text x="354" y="688" font-size="14" font-weight="600" fill="#141A21">Confirm &amp; notify the team</text></g><path d="M286,151 L324,151" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#wf-golden-arrow)"/><path d="M451,239 V294 H161 V349" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#wf-golden-arrow)"/><rect x="244.5" y="270" width="123.0" height="20" rx="10" fill="#FAFCFD" stroke="#C6D1DA"/><text x="306.0" y="284" text-anchor="middle" font-size="12" fill="#141A21">Ready &amp; checked</text><path d="M286,436 L324,436" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#wf-golden-arrow)"/><path d="M451,524 V579 H161 V634" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#wf-golden-arrow)"/><rect x="265.5" y="555" width="81.0" height="20" rx="10" fill="#FAFCFD" stroke="#C6D1DA"/><text x="306.0" y="569" text-anchor="middle" font-size="12" fill="#141A21">Unblocked</text><path d="M286,721 L324,721" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#wf-golden-arrow)"/><path d="M161,239 V294 H161 V349" fill="none" stroke="#46525E" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#wf-golden-arrow)"/><rect x="120.5" y="270" width="81.0" height="20" rx="10" fill="#FAFCFD" stroke="#C6D1DA"/><text x="161.0" y="284" text-anchor="middle" font-size="12" fill="#141A21">Fast path</text></svg>